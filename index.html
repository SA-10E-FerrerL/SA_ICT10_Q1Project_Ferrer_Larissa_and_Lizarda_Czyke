<main class="container py-5">

SKU Generator

<p class="mb-0 mt-2">

<!-- Card Body -->

<form id="sku-form">

<div class="mb-3">

<label for="category" class="form-label">
<i class="fa-solid fa-tags me-1"></i>

</label>

<select id="category" class="form-select">

<option value="Clothing">Clothing</option>
<option value="Accessories">Accessories</option>
<option value="Plushies">Plushies</option>
<option value="Collectibles">Collectibles</option>

<div class="mb-3">

<label for="product_name" class="form-label">
<i class="fa-solid fa-box me-1"></i>

</label>

<select id="product_name" class="form-select">

<option value="Chat Noir Hoodie">Chat Noir Hoodie</option>
<option value="Ladybug Hoodie">Ladybug Hoodie</option>
<option value="Rena Rouge Hoodie">Rena Rouge Hoodie</option>
<option value="Miraculous Paris Tote Bag">Miraculous Paris Tote Bag</option>

<i class="fa-solid fa-warehouse me-1"></i>

</label>

<input type="number" id="quantity" class="form-control" placeholder="e.g. 7" min="0">

</div>


<!-- Cool Button -->
<div class="d-grid">

<input type="button" py-click="SKU_generator" value="Generate SKU" class="btn btn-generate btn-lg text-white">
